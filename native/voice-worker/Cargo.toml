[package]
name = "jarvis-voice"
version = "0.4.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "CPU-only Vosk/Whisper/GTCRN voice worker for Jarvis"

[dependencies]
jarvis-phrases = { path = "../command-phrases" }
jarvis-gtcrn = { path = "../gtcrn-denoiser" }
jarvis-whisper = { path = "../whisper-recognizer" }
jarvis-moonshine = { path = "../moonshine-recognizer" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
# The completion callback per-app audio capture needs (#[implement]).
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_StationsAndDesktops",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
