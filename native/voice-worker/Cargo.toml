[package]
name = "jarvis-voice"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "CPU-only Vosk/Whisper/GTCRN voice worker for Jarvis"

[dependencies]
jarvis-phrases = { path = "../command-phrases" }
jarvis-gtcrn = { path = "../gtcrn-denoiser" }
jarvis-whisper = { path = "../whisper-recognizer" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
