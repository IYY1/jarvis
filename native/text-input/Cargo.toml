[package]
name = "jarvis-type"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Inserts dictated text into the focused Wayland text field for Jarvis"

[dependencies]
libc = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = "thin"
strip = "debuginfo"
